[package]
name = "arrow-flight_buffa"
description = "Apache Arrow Flight"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }

[dependencies]
arrow-arith = { workspace = true, optional = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
# Cast is needed to work around https://github.com/apache/arrow-rs/issues/3389
arrow-cast = { workspace = true }
arrow-data = { workspace = true }
arrow-ipc = { workspace = true }
arrow-ord = { workspace = true, optional = true }
arrow-row = { workspace = true, optional = true }
arrow-select = { workspace = true, optional = true }
arrow-schema = { workspace = true }
arrow-string = { workspace = true, optional = true }
base64 = { version = "0.23", default-features = false, features = ["std"] }
buffa = { version = "0.9", features = ["json"] }
# For Timestamp type
buffa-types = { version = "0.9", features = ["json", "chrono"] }
chrono = {workspace = true}
connectrpc = {version = "0.9", features = ["client"]}
http = "1.1.0"
serde_json = "1"
serde = { version = "1.0", features = ["derive"]}
bytes = { version = "1", default-features = false }
futures = { version = "0.3", default-features = false, features = ["alloc"] }
once_cell = { version = "1", optional = true }
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "rt-multi-thread"], optional = true }

# CLI-related dependencies
anyhow = { version = "1.0", optional = true }
clap = { version = "4.4.6", default-features = false, features = ["std", "derive", "env", "help", "error-context", "usage", "wrap_help", "color", "suggestions"], optional = true }
tracing-log = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3.1", default-features = false, features = ["ansi", "env-filter", "fmt"], optional = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = []
flight-sql = ["dep:arrow-arith", "dep:arrow-ord", "dep:arrow-row", "dep:arrow-select", "dep:arrow-string", "dep:once_cell"]
tls = ["connectrpc/tls"]

[dev-dependencies]
arrow-cast = { workspace = true, features = ["prettyprint"] }
# Enable the IPC compression codecs so tests can exercise compressed Flight encoding
arrow-ipc = { workspace = true, features = ["lz4", "zstd"] }
assert_cmd = "2.0.8"
criterion = { workspace = true, default-features = false, features = ["async_tokio"] }
http-body = "1.0.0"
hyper-util = "0.1"
pin-project-lite = "0.2"
tempfile = "3.3"
tokio = { version = "1.0", default-features = false, features = ["macros", "rt", "rt-multi-thread"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5.0", features = ["util"] }
uuid = { version = "1.10.0", features = ["v4"] }

[lints]
workspace = true

[build-dependencies]
connectrpc-build = "0.9"
